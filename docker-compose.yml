x-db-env: &db-env
  LZNEX_CLIENT: mysql
  LZNEX_HOST: mysql
  LZNEX_PORT: "3306"
  LZNEX_DATABASE: lznex
  LZNEX_USER: root
  LZNEX_PASSWORD: secret
  LZNEX_LIBRARY: /usr/lib/x86_64-linux-gnu/libmariadb.so.3

services:
  mysql:
    image: mysql:8.4
    container_name: lznex-mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: lznex
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -psecret --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Imagem unica: o stage builder compila CLI e testes, o runtime leva so o CLI.
  cli:
    build:
      context: .
    image: lznex:latest
    environment: *db-env
    volumes:
      # Migrations e config ficam no host: dao para editar sem rebuildar.
      - ./database:/home/lznex/database:ro
    depends_on:
      mysql:
        condition: service_healthy
    # Sem argumento mostra a ajuda. Ex.:
    #   docker compose run --rm cli migrate:latest
    command: ["--help"]

  # Unitarios: nao tocam no banco. Build mode Debug, com o gate de vazamento.
  tests:
    build:
      context: .
      target: builder
    image: lznex-builder:latest
    working_dir: /src
    environment:
      HEAPTRC: haltonnotreleased
    command: ["./bin/lznex-tests-debug"]

  # Integracao e concorrencia contra o MySQL real. LZNEX_IT liga os grupos que
  # sao pulados no run unitario.
  tests-it:
    build:
      context: .
      target: builder
    image: lznex-builder:latest
    working_dir: /src
    environment:
      <<: *db-env
      LZNEX_IT: "1"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: lznex
      DB_USER: root
      DB_PASS: secret
      DB_LIB: /usr/lib/x86_64-linux-gnu/libmariadb.so.3
      HEAPTRC: haltonnotreleased
    depends_on:
      mysql:
        condition: service_healthy
    command: ["./bin/lznex-tests-debug"]

  # API Horse de exemplo, provando que outro projeto consome o pacote.
  api:
    build:
      context: .
      dockerfile: example/api/Dockerfile
    image: lznex-api:latest
    container_name: lznex-api
    environment: *db-env
    ports:
      - "9000:9000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Container de desenvolvimento: toolchain completo com o repo montado.
  # E o que o spike/check.sh usa para compilar sem rebuildar a imagem.
  spike:
    build:
      context: ./spike
    image: lznex-dev:latest
    container_name: lznex-spike
    environment:
      <<: *db-env
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: lznex
      DB_USER: root
      DB_PASS: secret
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/work
    working_dir: /work
    command: ["sleep", "infinity"]

volumes:
  mysql-data:
